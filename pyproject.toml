[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "python-data-analyst-academy"
version = "0.1.0"
description = "Interactive Python and data analytics learning with alternative dataset validation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3",
  "pandas>=2.2,<4", "numpy>=2,<3", "httpx>=0.28,<1",
  "docker>=7,<8", "black>=25,<27", "argon2-cffi>=23,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<3", "pandas-stubs>=2.2", "hypothesis>=6,<7"]
runner = ["matplotlib>=3.9,<4", "seaborn>=0.13,<1", "scipy>=1.14,<2", "openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
include = ["academy*", "runner*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["academy", "runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires working Docker engine and academy-sandbox image"]
