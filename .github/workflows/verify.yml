name: Verify Academy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev,runner]'
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify source, content, containers, grading, security and E2E
        run: python scripts/verify.py --full
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            docs/screenshots
      - name: Compose diagnostics
        if: failure()
        run: docker compose logs --tail 150
      - name: Shut down CI services
        if: always()
        run: docker compose down
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip && pip install -e . pip-audit
      - run: pip-audit --local --skip-editable
      - working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=high
